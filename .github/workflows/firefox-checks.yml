name: Firefox extension checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - run: npx wxt prepare
      - run: npm run typecheck
      - run: npm run build:firefox
      - name: Package Firefox extension
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npm run zip:firefox
          mkdir -p artifacts
          find .output -type f -name '*firefox.zip' -exec cp {} artifacts/ \;
          find .output -type f -name '*sources.zip' -exec cp {} artifacts/ \;
          test -n "$(find artifacts -type f -name '*.zip' -print -quit)"
          ls -lh artifacts
      - name: Upload Firefox extension package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: samewindow-aws-assistant-firefox
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14
